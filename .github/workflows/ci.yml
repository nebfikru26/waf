name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AffiniSecurity.Waf.Tests/AffiniSecurity.Waf.Tests.csproj

      - name: Build
        run: dotnet build AffiniSecurity.Waf.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test AffiniSecurity.Waf.Tests/AffiniSecurity.Waf.Tests.csproj --no-restore --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Non-blocking for now: the existing codebase has a pre-existing backlog of
        # @typescript-eslint/no-explicit-any findings unrelated to CI setup. Reported here so
        # regressions are visible, but doesn't fail the pipeline until that backlog is cleared.
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
