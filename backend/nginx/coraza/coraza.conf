# Core Coraza Configuration
# Set the engine mode to On (or DetectionOnly)
SecRuleEngine On

# Response body inspection disabled — standard for reverse proxy WAFs.
# We protect inbound requests, not outbound responses from our own backend.
# Enabling this caused hangs on large JSON responses (e.g. 642 OWASP rules).
SecResponseBodyAccess Off

# Audit logs
SecAuditEngine RelevantOnly
SecAuditLog /var/log/coraza/audit.log
SecAuditLogFormat JSON
SecAuditLogType Serial

# Timeouts
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
