# --- OWASP CRS Setup ---

# Set default paranoia level and version marker marker
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.crs_setup_version=425,setvar:tx.paranoia_level=1"

# Set anomaly thresholds
SecAction "id:900110,phase:1,nolog,pass,t:none,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"

# Set mandatory methods (allow common REST ones)
SecAction "id:900200,phase:1,nolog,pass,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT DELETE PATCH'"

# Integration mode: Self-contained vs Anomaly Scoring
# We use Anomaly Scoring (1)
SecAction "id:900111,phase:1,nolog,pass,t:none,setvar:tx.anomaly_scoring_mode=1"
