limit_req_zone $binary_remote_addr zone=waf_ratelimit:10m rate=150r/m;

server {
    listen 80;
    listen 443 ssl;
    server_name localhost;

    # Using dummy certs for dev - in K8s these would be managed by cert-manager
    ssl_certificate     /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # WAF Inclusions
    coraza_rules_file /opt/coraza/config/coraza-rules.conf;

    location /api/firewall/owasp-rules {
        coraza off;
        set $upstream_api http://api-dotnet:8080;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/internal/ {
        # Allow Docker internal network only — blocks all external access
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        coraza off;
        set $upstream_api http://api-dotnet:8080;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/auth/login-ai {
        coraza off;
        auth_request /internal/ai-inspect;
        client_body_buffer_size 1m;
        rewrite ^/api/auth/login-ai$ /api/auth/login break;
        set $upstream_api http://api-dotnet:8080;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        auth_request /internal/ai-inspect;
        # Buffer the client body so NJS can read it in the subrequest
        client_body_buffer_size 1m;
        set $upstream_api http://api-dotnet:8080;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Protect upstream .NET against floods (burst 30 allowed, others delayed/rejected)
        limit_req zone=waf_ratelimit burst=30 nodelay;
        
        # Phase 10: Pass bot telemetry to the backend for Python ML ingestion
        proxy_set_header X-Bot-Telemetry $http_x_bot_telemetry;
    }

    location = /internal/ai-inspect {
        internal;
        coraza off;
        js_content ai_agent.authorize;
    }

    location = /internal/ai-sidecar {
        internal;
        coraza off;
        proxy_pass http://unix:/var/run/shared/ai.sock:/v1/classify;
        proxy_set_header Content-Type "application/json";
        proxy_connect_timeout 50ms;
        proxy_read_timeout 150ms;
    }

    location /assets/ {
        coraza off;
        root /srv;
    }

    location /images/ {
        coraza off;
        root /srv;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp)$ {
        coraza off;
        root /srv;
        access_log off;
        expires 1y;
        add_header Cache-Control "public";
    }

    # ── Phase 10: Bot Behavioral Beacon ──────────────────────────────────────
    # Serve the JS beacon that collects kinetic biometrics from real browsers.
    # Headless bots (Selenium/Puppeteer) will show zero/flat telemetry vectors.
    location = /bot-beacon.js {
        coraza off;
        alias /etc/nginx/conf.d/bot_beacon.js;
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location / {
        root /srv;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

include /etc/nginx/conf.d/tenants/*.conf;
