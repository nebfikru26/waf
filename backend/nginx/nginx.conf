# user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log info;
pid        /tmp/nginx.pid;

load_module "/usr/lib/nginx/modules/ngx_http_coraza_module.so";
load_module "/usr/lib/nginx/modules/ngx_http_js_module.so";

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # WAF Configuration
    coraza on;
    js_import /etc/nginx/conf.d/ai_agent.js;
    # We will include rules in server blocks or here
    
    # Cloud-Native scaling: Use DNS for resolving upstreams in K8s
    resolver 127.0.0.11 valid=30s;

    include /etc/nginx/conf.d/*.conf;

    # Internal metrics server for Prometheus
    server {
        listen 9113;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;

        location /metrics {
            stub_status on;
            access_log off;
        }
    }
}
